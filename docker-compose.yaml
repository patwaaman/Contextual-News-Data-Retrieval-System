version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: news-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: newsdb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo_data:
